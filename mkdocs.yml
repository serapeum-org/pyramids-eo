site_name: pyramids-eo
site_description: Remote-sensing / Earth-observation tier for the pyramids stack
site_url: https://serapeum-org.github.io/pyramids-eo/
repo_url: https://github.com/serapeum-org/pyramids-eo
repo_name: serapeum-org/pyramids-eo

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
  - tags
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
  - Guides:
    - STAC provider signers: stac-signers.md
  - Examples:
    - Sensor registry & calibration: examples/registry_calibration.ipynb
    - FCI / SEVIRI readers & harmonise: examples/readers_fci_seviri_harmonise.ipynb
    - Day/night compositing primitives: examples/day_night_compositing.ipynb
    - Day/night + eclipse (end to end): examples/eclipse_day_night.ipynb
  - Reference:
    - Overview: reference/index.md
    - Sensors:
      - Readers: reference/readers.md
      - Registry: reference/registry.md
    - Errors: reference/errors.md
    - STAC signers: reference/stac.md
    - Composites: reference/composites.md
  - About:
    - Change-log: change-log.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Contributing: contributing.md
    - License: LICENSE.md
    - Authors: AUTHORS.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/pyramids-eo
  version:
      provider: mike
      version_selector: true
