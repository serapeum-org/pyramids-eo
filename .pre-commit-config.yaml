fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        name: "[py -  check] check toml"
      - id: end-of-file-fixer
        name: "[file - format] end of file fixer"
      - id: no-commit-to-branch
        name: "[git -  check] no commit to branch"
        args: [ --branch=main ]
      - id: trailing-whitespace
        name: "[file - format] trim trailing whitespace"
        args: [ --markdown-linebreak-ext=md ]
      - id: check-added-large-files
        name: "[file -  check] large file"
        args: [ --maxkb=2000 ]
      - id: check-docstring-first
        name: "[py   -  check] docstring first"
        files: /examples
        types : [file, python ]
      - id: check-json
        name: "[json -  check] validate json"
      - id: check-merge-conflict
        name: "[git  -  check] merge conflict"
      - id: debug-statements
        name: "[py   -  check] debug statements"
      - id: detect-private-key
        name: "[cred -  check] private keys"
      - id: mixed-line-ending
        name: "[file - format] mixed line ending"
        args: [ --fix=auto ]
      - id: pretty-format-json
        name: "[json - format] pretty json"
        args: [ --autofix,
                --indent=4,
                --no-sort-keys ]
      - id: requirements-txt-fixer
        name: "[reqs - format] fix requirements.txt"
      - id: check-yaml
        name: "[yaml -  check] validate yaml"
        exclude: mkdocs\.yml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        name: "[py   -   lint] ruff"
        args: [--fix]
      - id: ruff-format
        name: "[py   - format] ruff-format"

  - repo: https://github.com/rlindsgaard/pre-commit-commit-msg-hooks
    rev: 0.1.0
    hooks:
      - id: check-description-max-length
        name: "[git  -  format] check-description-max-length"
      - id: check-second-line-empty
        name: "[git  -  format] check-second-line-empty"
      - id: check-summary-capitalized
        name: "[git  -  format] check-summary-capitalized"
      - id: check-summary-imperative
        name: "[git  -  format] check-summary-imperative"
      - id: check-summary-max-length
        name: "[git  -  format] check-summary-max-length"
      - id: check-summary-punctuation
        name: "[git  -  format] check-summary-punctuation"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '\.(ipynb|drawio)$'

  - repo: local
    hooks:
      - id: mypy
        name: "[py   -  type] mypy"
        entry: pixi run -e dev mypy
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

  - repo: local
    hooks:
      - id: doctest
        name: "[py   -  doc] doctest"
        entry: pixi run -e dev pytest --doctest-modules src/pyramids_eo -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
        types: [python]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pixi run -e dev pytest -v --cov=src/pyramids_eo --cov-report=term-missing -m "not plot and not live"
        language: system
        pass_filenames: false
        always_run: true
