# MTG-FCI (FDHSI) channel table.
#
# NOMINAL constants — wavelengths / resolutions / kinds are from the instrument
# spec; the thermal central_wavenumber_cm1 is the nominal 1e4/wavelength with an
# identity band correction (alpha=1, beta=0). solar_irradiance is the band-effective
# solar irradiance in the wavenumber form the L1 radiance uses (mW m-2 (cm-1)-1), so
# reflectance = pi * L * d^2 / solar_irradiance is dimensionless; the values are the
# published MTG-I1 channel_effective_solar_irradiance. A reader should PREFER the
# per-granule calibration metadata (real FDHSI granules carry it) and use this table
# only as a fallback. Verify against the official EUMETSAT FCI calibration tables
# before relying on these numbers for quantitative products.
name: fci
