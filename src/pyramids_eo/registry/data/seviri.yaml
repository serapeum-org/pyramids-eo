# MSG-SEVIRI channel table.
#
# The thermal central_wavenumber_cm1 / alpha / beta are the published Meteosat-9
# effective-radiance-to-brightness-temperature constants (EUMETSAT MSG Level 1.5
# calibration); solar_irradiance is nominal. These vary per Meteosat spacecraft
# (MSG-8/9/10/11) — a reader should PREFER the per-granule metadata and use this
# table (Meteosat-9 class) only as a fallback.
